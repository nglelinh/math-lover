<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="map scale ratio">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#223042"/>
      </marker>
    </defs>
    <rect width="960" height="540" fill="#FFF7ED"/><rect x="90" y="110" width="780" height="320" rx="28" fill="#FFFFFF" stroke="#223042" stroke-width="4"/><text x="480" y="170" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#223042" text-anchor="middle">Map scale 1 cm : 100 m</text><rect x="160" y="230" width="200" height="16" rx="6" fill="#FF8A65" stroke="#223042" stroke-width="3"/><text x="260" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#223042" text-anchor="middle">3 cm on paper</text><line x1="400" y1="238" x2="520" y2="238" stroke="#223042" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="560" y="214" width="240" height="50" rx="14" fill="#38B8C5" stroke="#223042" stroke-width="4"/><text x="680" y="248" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#223042" text-anchor="middle">300 m walk</text><text x="480" y="380" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#5F6B7A" text-anchor="middle">Keep the ratio. Change the size.</text></svg>