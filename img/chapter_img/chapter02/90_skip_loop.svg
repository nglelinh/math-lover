<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="skip counting coding loop">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#223042"/>
      </marker>
    </defs>
    <rect width="960" height="540" fill="#FFF7ED"/><rect x="90" y="100" width="780" height="340" rx="28" fill="#FFFFFF" stroke="#223042" stroke-width="4"/><text x="480" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#223042" text-anchor="middle">Repeat 4 times: add 5</text><circle cx="160" cy="270" r="38" fill="#F6C453" stroke="#223042" stroke-width="4"/><text x="160" y="282" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#223042" text-anchor="middle">0</text><line x1="200" y1="270" x2="260" y2="270" stroke="#223042" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="300" cy="270" r="38" fill="#38B8C5" stroke="#223042" stroke-width="4"/><text x="300" y="282" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#223042" text-anchor="middle">5</text><line x1="340" y1="270" x2="400" y2="270" stroke="#223042" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="440" cy="270" r="38" fill="#38B8C5" stroke="#223042" stroke-width="4"/><text x="440" y="282" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#223042" text-anchor="middle">10</text><line x1="480" y1="270" x2="540" y2="270" stroke="#223042" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="580" cy="270" r="38" fill="#38B8C5" stroke="#223042" stroke-width="4"/><text x="580" y="282" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#223042" text-anchor="middle">15</text><line x1="620" y1="270" x2="680" y2="270" stroke="#223042" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="720" cy="270" r="38" fill="#38B8C5" stroke="#223042" stroke-width="4"/><text x="720" y="282" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#223042" text-anchor="middle">20</text><text x="480" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#5F6B7A" text-anchor="middle">A coding loop is skip counting with a start button</text></svg>