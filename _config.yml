# Setup
title:               "Math Lover"
description:         'A Discovery-Based Mathematics Course for Children Ages 8-12'
url:                 https://nglelinh.github.io
baseurl:             '/math-lover'
imgurl:              /math-lover/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Math Lover"
    description: "A Discovery-Based Mathematics Course for Children Ages 8-12"
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
    wonder: "Wonder"
    puzzle: "Puzzle"
    story_arc: "Story Arc"
  vi:
    title: "Người Yêu Toán"
    description: "Khóa Học Toán Khám Phá cho Trẻ 8-12 Tuổi"
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
    wonder: "Điều Kỳ Diệu"
    puzzle: "Câu Đố"
    story_arc: "Câu Chuyện"
# About/contact
author:
  name:              Your Name
  email:             your.email@example.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.0.1
markdown: kramdown

# Analytics
google_analytics_id: ""
